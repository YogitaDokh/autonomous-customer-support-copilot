<!DOCTYPE html>
<html>
<head>
    <title>Live Analytics Dashboard</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: 0.3s;
        }

        .light-mode {
            background: white;
            color: black;
        }

        .light-mode .sidebar {
            background: #f1f5f9;
        }

        .light-mode .chat-container {
            background: #ffffff;
        }

        .light-mode .message {
            background: #e2e8f0;
            color: black;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #38bdf8;
        }

        .back-btn {
            text-decoration: none;
            background: #38bdf8;
            color: black;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        /* Stats Cards */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .card h1 {
            font-size: 42px;
        }

        /* Charts Layout */

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .chart-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 14px;
            min-height: 500px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        /* Responsive */

        @media (max-width: 900px) {

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .top-bar {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
        }

    </style>
</head>

<body>

    <!-- Top Navigation -->

    <div class="top-bar">

        <button onclick="toggleTheme()" id="theme-btn">
            Toggle Theme
        </button>

        <h1>📊 Live Support Analytics</h1>

        <a href="/" class="back-btn">
            ← Back to Chat
        </a>

    </div>

    <!-- Stats Cards -->
     <div class="stats-container">

        <div class="stat-card">
            <h3>Total Users</h3>
            <p>{{ total_users }}</p>
        </div>

        <div class="stat-card">
            <h3>Total Messages</h3>
            <p>{{ total_messages }}</p>
        </div>

        <div class="stat-card">
            <h3>Escalation %</h3>
            <p>{{ escalation_percentage }}%</p>
        </div>

        <div class="stat-card">
            <h3>Avg Messages/Chat</h3>
            <p>{{ average_messages }}</p>
        </div>

    </div>

    <div class="stats-grid">

        <div class="card">
            <h2>Total Conversations</h2>
            <h1>{{ total_conversations }}</h1>
        </div>

        <div class="card">
            <h2>Total Escalations</h2>
            <h1>{{ total_escalations }}</h1>
        </div>

    </div>

    <!-- Charts -->

    <div class="charts-grid">

        <div class="chart-container">
            <div id="pie-chart"></div>
        </div>

        <div class="chart-container">
            <div id="bar-chart"></div>
        </div>

    </div>

    <!-- Plotly Scripts -->

    <script>

    // Parse JSON safely from Flask
    const pieGraph = JSON.parse(`{{ pie_graph | safe }}`);

    Plotly.newPlot(
        'pie-chart',
        pieGraph.data,
        pieGraph.layout,
        { responsive: true }
    );

    const barGraph = JSON.parse(`{{ bar_graph | safe }}`);

    Plotly.newPlot(
        'bar-chart',
        barGraph.data,
        barGraph.layout,
        { responsive: true }
    );

    // Auto refresh every 10 seconds
    setTimeout(function () {
        location.reload();
    }, 10000);

    function toggleTheme() {

        document.body.classList.toggle("light-mode");

        if(document.body.classList.contains("light-mode")) {

            localStorage.setItem("theme", "light");

        } else {

            localStorage.setItem("theme", "dark");
        }
    }

    window.onload = () => {

        const savedTheme = localStorage.getItem("theme");

        if(savedTheme === "light") {

            document.body.classList.add("light-mode");
        }
    }

</script>

</body>
</html>
