<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>

    <style>

        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            text-decoration: none;
            background: #38bdf8;
            color: black;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            color: #38bdf8;
        }

    </style>

</head>

<body>

    <div class="top-bar">

        <h1>⚙ Settings</h1>

        <a href="/" class="back-btn">
            ← Back to Chat
        </a>

    </div>

    <div class="card">

        <h2>Bot Configuration</h2>

        <p>Model: llama-3.1-8b-instant</p>

        <p>Status: Active</p>

        <p>RAG System: Enabled</p>

    </div>

    <div class="card">

        <h2>System Information</h2>

        <p>Autonomous Customer Support Copilot</p>

        <p>Version 1.0</p>

    </div>

</body>
</html>
